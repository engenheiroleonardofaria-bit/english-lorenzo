<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English do Lorenzo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column "trail map" app — a mountain path of lessons, each lesson a full-screen card flow; single bright daytime look by choice */
:root{
  --sky:#E8F4FF; --sky2:#D3EAFF; --ink:#16324F; --ink2:#4A6382;
  --sun:#FFB627; --leaf:#2BB673; --berry:#FF5D73; --ocean:#2F80ED;
  --card:#FFFFFF; --line:#C9DDF2;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.2px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--ocean);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--sun);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 #D9930E}
.brand h1{font-size:24px}
.brand small{display:block;color:var(--ink2);font-size:13px;font-weight:700}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.hero{background:var(--ocean);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #1F5FB8}
.hero h2{font-size:26px}
.hero p{margin:0;opacity:.95}
.btn{background:var(--leaf);color:#fff;font-family:var(--display);font-weight:600;font-size:20px;padding:14px 22px;border-radius:18px;box-shadow:0 5px 0 #1D8752;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1D8752}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #D9930E}
.btn:disabled{opacity:.45;cursor:not-allowed}
.trail{display:flex;flex-direction:column;gap:10px}
.stop{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;width:100%}
.stop .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--sky2);flex:none}
.stop .t{flex:1;min-width:0}
.stop .t b{font-family:var(--display);font-size:19px;font-weight:600;display:block}
.stop .t span{color:var(--ink2);font-size:14px}
.stop.done .ic{background:#D7F5E5}
.stop.today{border-color:var(--sun);box-shadow:0 4px 0 #F2D08A}
.stop.locked{opacity:.55}
.stars{color:var(--sun);font-size:18px;letter-spacing:1px;white-space:nowrap}
.sec-label{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;color:var(--ink2);margin-top:6px}
.parent-link{background:none;color:var(--ink2);font-weight:800;font-size:14px;text-decoration:underline;padding:8px;align-self:center}
/* lesson */
.bar{height:14px;background:var(--sky2);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.lhead{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:18px;font-weight:800;flex:none}
.stage{background:var(--card);border-radius:28px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;border:2px solid var(--line);min-height:420px}
.phase{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;color:var(--ocean);background:var(--sky);padding:5px 12px;border-radius:99px}
.big{font-size:110px;line-height:1.05}
.word{font-family:var(--display);font-size:42px;font-weight:700}
.pt{color:var(--ink2);font-weight:700}
.prompt{font-family:var(--display);font-size:24px;font-weight:600}
.speak{width:64px;height:64px;border-radius:50%;background:var(--ocean);color:#fff;font-size:28px;box-shadow:0 4px 0 #1F5FB8}
.speak.slow{width:48px;height:48px;font-size:20px;background:var(--sky2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{background:var(--sky);border:3px solid var(--line);border-radius:20px;padding:14px 8px;min-height:96px;display:grid;place-items:center;font-size:58px;transition:transform .1s}
.opt.txt{font-size:24px;font-family:var(--display);font-weight:600;min-height:72px}
.opt.wide{grid-column:1/-1;font-size:20px;min-height:60px;text-align:left;padding:14px 18px;place-items:center start}
.opt:active{transform:scale(.97)}
.opt.ok{background:#D7F5E5;border-color:var(--leaf)}
.opt.bad{background:#FFE1E6;border-color:var(--berry);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s}
.mic{width:96px;height:96px;border-radius:50%;background:var(--berry);color:#fff;font-size:40px;box-shadow:0 6px 0 #C93A4E}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #C93A4E,0 0 0 16px rgba(255,93,115,.2)}}
.heard{min-height:28px;font-weight:800;color:var(--ink2)}
.feedback{font-family:var(--display);font-size:22px;font-weight:600;min-height:30px}
.feedback.g{color:var(--leaf)} .feedback.r{color:var(--berry)}
.tries{display:flex;gap:6px}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--sky2)}
.tries i.used{background:var(--berry)}
.note{font-size:13px;color:var(--ink2);max-width:40ch}
.bubble{background:var(--sky);border-radius:20px 20px 20px 6px;padding:14px 18px;font-family:var(--display);font-size:24px;font-weight:600;align-self:flex-start;text-align:left;display:flex;gap:10px;align-items:center}
.who{font-size:44px}
/* parent */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--sky);border-radius:16px;padding:12px}
.kpi b{font-family:var(--display);font-size:28px;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink2)}
.tbl{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#FFE1E6;color:#A3243A;border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px}
.chip.g{background:#D7F5E5;color:#17774A}
.month{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.month b{font-family:var(--display);color:var(--ocean)}
.month.cur b{color:var(--leaf)}
.gate{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.gate input{font:inherit;font-size:28px;width:140px;text-align:center;border:3px solid var(--line);border-radius:14px;padding:8px;font-family:var(--display);color:var(--ink);background:var(--card)}
.banner{background:#FFF4D6;border:2px solid #F2D08A;border-radius:16px;padding:12px 14px;font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
/* reward map */
.teaser{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--sun);border-radius:20px;padding:14px;text-align:left;width:100%;box-shadow:0 4px 0 #F2D08A}
.teaser .chest{font-size:40px;flex:none;animation:bob 1.6s infinite}
.teaser .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.teaser b{font-family:var(--display);font-size:18px;font-weight:600}
.teaser span{font-size:14px;color:var(--ink2);font-weight:700}
@keyframes bob{50%{transform:translateY(-5px)}}
.map{position:relative;background:linear-gradient(180deg,#CFEFFF,#BFE6D6);border-radius:28px;border:2px solid var(--line);overflow:hidden}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .node svg,.map .walker svg{display:block}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:48%;text-align:center}
.isle{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:var(--card);border:3px solid var(--line);position:relative}
.node.done .isle{background:#D7F5E5;border-color:var(--leaf)}
.node.cur .isle{border-color:var(--sun);box-shadow:0 0 0 7px rgba(255,182,39,.35)}
.node.lock .isle{filter:grayscale(.7);opacity:.75}
.avatar{position:absolute;top:-30px;right:-14px;font-size:32px;animation:bob 1.2s infinite}
.node b{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.15}
.node small{font-size:12px;font-weight:800;color:var(--ink2)}
.prize{font-size:12px;font-weight:800;background:#FFF4D6;border:1.5px solid #F2D08A;border-radius:12px;padding:3px 8px;color:#8A5A00;max-width:100%}
.node.done .prize{background:#D7F5E5;border-color:#9ADBB9;color:#17774A}
.weeks{display:flex;gap:4px}
.weeks i{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--sun)}
.weeks i.on{background:var(--sun)}
.przrow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.przrow b{font-family:var(--display);color:var(--ocean);font-size:14px}
.przrow input[type=text]{font:inherit;font-size:15px;width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 8px;color:var(--ink);background:var(--card);min-width:0}
.przrow label{font-size:13px;font-weight:700;color:var(--ink2);display:inline-flex;gap:4px;align-items:center;margin-right:10px}
.przrow .opts{grid-column:2}
/* game world */
.pixel{font-family:"Pixelify Sans",var(--display)!important;letter-spacing:.3px}
.parade{position:relative;height:74px;overflow:hidden;border-radius:14px;border:2px solid var(--line);background:linear-gradient(#9AD8FF,#D6F0FF)}
.parade .ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.15) 14px 16px),linear-gradient(#5BC236 0 5px,#8D5A32 5px 100%)}
.walker{position:absolute;left:-40px;background:none;padding:0;border:0;animation:walkX 20s linear infinite;z-index:5}
@keyframes walkX{from{left:-40px}to{left:calc(100% + 8px)}}
.walker.rev{animation-direction:reverse}
.walker.rev svg{transform:scaleX(-1)}
.hop{display:block;animation:hop .45s steps(1,end) infinite}
@keyframes hop{0%{transform:none}50%{transform:translateY(-3px)}}
.walker.jump .hop{animation:jump .6s ease-out}
@keyframes jump{40%{transform:translateY(-24px)}100%{transform:none}}
.say{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-family:"Pixelify Sans",var(--display);font-size:14px;font-weight:700;padding:2px 7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.walker.jump .say{opacity:1}
.map{background:linear-gradient(180deg,#6EC1FF,#A9E0FF 35%,#C9F2DA 70%,#A8E6C0)}
.cloud{position:absolute;left:-90px;width:72px;height:16px;background:#fff;opacity:.9;animation:drift 50s linear infinite;z-index:1}
.cloud::before{content:"";position:absolute;left:16px;top:-14px;width:36px;height:14px;background:#fff}
@keyframes drift{from{left:-90px}to{left:100%}}
.node{z-index:3}
.isle-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.sign{width:50px;height:50px;display:grid;place-items:center;font-size:27px;background:#FFF3D6;border:3px solid #5A2E0E;box-shadow:3px 3px 0 #5A2E0E;margin-bottom:6px}
.node.cur .sign{border-color:#E08E00;box-shadow:3px 3px 0 #E08E00,0 0 0 6px rgba(255,182,39,.45)}
.plat{width:124px;height:44px;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,0,0,.16) 14px 16px),linear-gradient(var(--top) 0 12px,#8D5A32 12px 100%);clip-path:polygon(0 0,100% 0,100% 60%,85% 60%,85% 100%,15% 100%,15% 60%,0 60%)}
.node.lock .isle-wrap{filter:grayscale(.85);opacity:.7}
.me{position:absolute;left:calc(50% + 20px);bottom:42px;display:flex;flex-direction:column;align-items:center;z-index:4}
.me .tag{font-family:"Pixelify Sans",var(--display);font-size:11px;font-weight:700;background:var(--berry);color:#fff;padding:1px 5px;margin-bottom:3px}
.node .prize{display:inline-flex;align-items:center;gap:5px}
/* game skin */
body{background:#A6DCFF linear-gradient(180deg,#5FB4FF 0,#A6DCFF 280px,#E8F4FF 560px) no-repeat}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.08) 2px,transparent 2px);background-size:24px 24px;z-index:0}
.wrap{position:relative;z-index:1}
.player h1,.mission,.p1,.lvl b{font-family:"Pixelify Sans",var(--display)}
.node b.pixel{font-family:var(--display)!important;font-weight:700}
.stop .t b{font-size:20px;font-weight:700;color:var(--ink)}
.stop .t span{font-size:15px;font-weight:700;color:var(--ink2)}
.stop.locked{opacity:.9;filter:grayscale(.35)}
.stop.locked .t b{color:#4A6382}
body::before{display:none}
.player{display:flex;align-items:center;gap:14px;background:#16324F;color:#fff;border:3px solid #0B1D30;box-shadow:0 6px 0 #0B1D30;border-radius:12px;padding:12px 14px}
.ava{width:88px;height:88px;flex:none;border:4px solid var(--sun);box-shadow:0 0 0 3px #0B1D30,5px 5px 0 3px #0B1D30;background:#fff;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.p1{font-family:"Pixelify Sans",var(--display);font-size:12px;color:var(--sun);letter-spacing:1.5px}
.player h1{font-size:30px;color:#fff;line-height:1}
.lvl{display:flex;align-items:center;gap:8px}
.lvl b{font-size:14px;color:#7CFFB2;white-space:nowrap}
.xp{flex:1;height:12px;background:#0B1D30;border:2px solid #4A6382}
.xp i{display:block;height:100%;min-width:4px;background:repeating-linear-gradient(90deg,#2BB673 0 8px,#45D18B 8px 10px)}
.player small{color:#A9C3E0;font-weight:700;font-size:12px}
.pmini{flex:none;align-self:flex-end;animation:hop .45s steps(1,end) infinite}
.pill{border-radius:8px;border-width:3px;box-shadow:0 3px 0 var(--line)}
.hero{border-radius:12px;border:3px solid #1F5FB8}
.mission{align-self:flex-start;background:var(--sun);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:1.5px;padding:3px 10px;border:2px solid #0B1D30;box-shadow:2px 2px 0 #0B1D30}
.btn{border-radius:10px;letter-spacing:1px}
.stop,.teaser,.card,.stage{border-radius:12px}
.stop{border-width:3px;box-shadow:0 4px 0 var(--line)}
.stop.today{animation:glow 1.4s steps(2,end) infinite}
@keyframes glow{50%{box-shadow:0 4px 0 #F2D08A,0 0 0 4px rgba(255,182,39,.55)}}
.stop .ic{border-radius:8px}
.sec-label{color:#16324F;font-size:14px}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:44px;height:52px;border-bottom:4px solid var(--ink2);background:var(--sky);border-radius:8px 8px 0 0;display:grid;place-items:center;font-family:"Pixelify Sans",var(--display);font-size:30px;font-weight:700}
.slot.on{background:#D7F5E5;border-color:var(--leaf)}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:440px}
.key{width:54px;height:58px;border-radius:10px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:"Pixelify Sans",var(--display);font-size:28px;font-weight:700;text-transform:uppercase}
.key.used{opacity:.25}
.key.bad{background:#FFE1E6;border-color:var(--berry);animation:shake .35s}
.key.hint{border-color:var(--sun);box-shadow:0 4px 0 #D9930E;animation:glow 1s steps(2,end) infinite}
.line{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:52px}
.wslot{min-width:56px;padding:8px 10px;border-bottom:4px solid var(--ink2);background:var(--sky);border-radius:8px 8px 0 0;font-family:var(--display);font-size:22px;font-weight:700}
.wslot.on{background:#D7F5E5;border-color:var(--leaf)}
.tile{padding:10px 14px;border-radius:10px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-size:22px;font-weight:700}
.tile.used{opacity:.25}
.tile.bad,.wbox.bad{background:#FFE1E6;border-color:var(--berry);animation:shake .35s}
.wbox{width:100%;max-width:360px;font-family:var(--display);font-size:30px;font-weight:700;text-align:center;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--sky);color:var(--ink)}

.pill.cur{border-color:var(--sun);background:#FFF3D6}
@media (max-width:380px){.ava{width:68px;height:68px}.player h1{font-size:24px}.pmini{display:none}}
@media (prefers-reduced-motion:reduce){.walker{left:var(--x,40%)!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* conteúdo em lessons.js */
function fillFrame(f,word){const w=/^[A-Z]{2,}$/.test(word)?word:word.toLowerCase();const s=f.replace("_",w);return s.charAt(0).toUpperCase()+s.slice(1)}
const weekOf=id=>Math.ceil(id/7);
// review lessons pull one word from each lesson of their week; lesson 28 reviews the whole month
LESSONS.filter(l=>l.review).forEach(r=>{
  const mo=Math.ceil(r.id/28),fin=r.id%28===0;
  const base=LESSONS.filter(l=>!l.review&&Math.ceil(l.id/28)===mo&&(fin||weekOf(l.id)===weekOf(r.id)));
  const src=fin?[0,4,8,12,16,20].map(k=>base[k]):base;
  r.words=src.map((l,i)=>l.words[(i+r.id)%6]);
});

const ROADMAP=[
 ["Mês 1","Primeiras palavras: cumprimentos, cores, animais, números, família e comida"],
 ["Mês 2","Eu e minha casa: partes da casa, objetos, \"This is my…\""],
 ["Mês 3","Escola e rotina: material escolar, dias da semana, horas simples"],
 ["Mês 4","Gostos e posses: \"I like / I don't like\", \"I have\""],
 ["Mês 5","Ações: run, jump, eat, play — \"I can…\""],
 ["Mês 6","Perguntas: What, Where, Who — responder com frases curtas"],
 ["Mês 7","Leitura: frases curtas e mini-textos com figuras"],
 ["Mês 8","Clima, roupas e corpo"],
 ["Mês 9","Histórias curtas: ler, ouvir e recontar"],
 ["Mês 10","Passado simples básico: \"Yesterday I played…\""],
 ["Mês 11","Conversas do dia a dia: loja, restaurante, viagem"],

/* ---------- MATCHING (tolerant, for kids) ---------- */
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
const NUM={one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",thirteen:"13",fourteen:"14",fifteen:"15",sixteen:"16",seventeen:"17",eighteen:"18",nineteen:"19",twenty:"20"};
// strict for short words (cap≠cup, ear≠year), small tolerance only for long words
function matches(heard,target){
  let h=norm(heard),t=norm(target);if(!h||!t)return false;
  const fix=s=>s.split(" ").map(w=>NUM[w]||w).join(" ");h=fix(h);t=fix(t);
  const tw=t.split(" "),hw=h.split(" ");
  const near=(x,w)=>x===w||(w.length>=6&&lev(x,w)<=1);
  if(tw.length===1)return hw.some(x=>near(x,tw[0]));
  if((" "+h+" ").includes(" "+t+" "))return true;
  return tw.filter(w=>hw.some(x=>near(x,w))).length/tw.length>=.8;
}

/* ---------- LESSON FLOW ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startLesson(lesson,isPreview){
  preview=isPreview;
  const W=lesson.words;const steps=[];
  W.forEach(w=>steps.push({k:"learn",w}));
  const kinds=["listen","read","see","listen","read","see"];
  shuffle(W).forEach((w,i)=>steps.push({k:kinds[i],w,opts:shuffle([w,...shuffle(W.filter(x=>x!==w)).slice(0,3)])}));
  if(lesson.id<=28){
    shuffle(W.filter(w=>/^[A-Za-z]{3,8}$/.test(w[0]))).slice(0,2).forEach(w=>steps.push({k:"spell",w}));
    shuffle(W).slice(0,3).forEach(w=>steps.push({k:"say",w}));
  } else {
    shuffle(W).slice(0,3).forEach(w=>steps.push({k:"write",w,err:0}));
    if(lesson.frame){const w=shuffle(W)[0];steps.push({k:"build",w,sent:fillFrame(lesson.frame,w[0])})}
    steps.push({k:"build",w:null,sent:lesson.talk.opts[lesson.talk.a]});
    shuffle(W).slice(0,2).forEach(w=>steps.push({k:"say",w}));
    if(lesson.frame){const w=shuffle(W)[0];steps.push({k:"sayS",w,sent:fillFrame(lesson.frame,w[0])})}
  }
  steps.push({k:"talk"});steps.push({k:"talkSay"});
  L={tOrder:shuffle([0,1,2]),lesson,steps,i:0,t0:Date.now(),qOk:0,qTot:0,misses:{},speak:[],firstTry:true,tries:0};
  view="lesson";render();
}
function next(){L.i++;L.firstTry=true;L.tries=0;micMsg="";if(L.i>=L.steps.length)finish();else render()}
function header(){const p=Math.round(L.i/L.steps.length*100);
  return `<div class="lhead"><button class="x" id="quit" aria-label="Sair da aula">✕</button><div class="bar"><i style="width:${p}%"></i></div><span class="pill">⭐ ${L.qOk}</span></div>`}

function renderStep(){
  const s=L.steps[L.i];const w=s.w;let body="";
  if(s.k==="learn"){
    body=`<span class="phase">Aprender · ouça e veja</span><div class="big pop">${w[2]}</div><div class="word">${esc(w[0])}</div><div class="pt">${esc(w[1])}</div>
    <div class="row"><button class="speak" id="sp" aria-label="Ouvir">🔊</button><button class="speak slow" id="sl" aria-label="Ouvir devagar">🐢</button></div>

    body=`<span class="phase">Ouvir · toque na figura certa</span><button class="speak" id="sp" aria-label="Ouvir de novo">🔊</button><div class="prompt">Onde está…?</div>
    <div class="grid">${s.opts.map((o,j)=>`<button class="opt" data-j="${j}" aria-label="${esc(o[1])}">${o[2]}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  } else if(s.k==="read"){
    body=`<span class="phase">Ler · qual é a palavra?</span><div class="big">${w[2]}</div>

  } else if(s.k==="see"){
    body=`<span class="phase">Ler · encontre a figura</span><div class="word">${esc(w[0])}</div>

  } else if(s.k==="spell"){
    if(!s.st){const lw=w[0].toLowerCase();const ab=[..."abcdefghijklmnoprstuvwy"].filter(c=>!lw.includes(c));

    <div class="bank">${s.st.bank.map((b,j)=>`<button class="key${b.used?" used":""}" data-k="${j}" ${b.used?"disabled":""}>${b.c}</button>`).join("")}</div>

  } else if(s.k==="write"){
    body=`<span class="phase">Escrever · digite em inglês</span><div class="big">${w[2]}</div><div class="pt">${esc(w[1])}</div>

  } else if(s.k==="build"){

    body=`<span class="phase">Frase · monte na ordem certa</span>${s.w?`<div class="big">${s.w[2]}</div>`:`<div class="who">🦉</div><div class="pt">${esc(L.lesson.talk.q)}</div>`}
    <button class="speak" id="sp" aria-label="Ouvir">🔊</button>
    <div class="line">${words.map((c,i)=>`<span class="wslot${i<s.st.pos?" on":""}">${i<s.st.pos?esc(c):"&nbsp;"}</span>`).join("")}</div>
    <div class="bank">${s.st.bank.map((b,j)=>`<button class="tile${b.used?" used":""}" data-t="${j}" ${b.used?"disabled":""}>${esc(b.c)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  } else if(s.k==="say"||s.k==="talkSay"||s.k==="sayS"){
    const target=s.k==="say"?w[0]:s.k==="sayS"?s.sent:L.lesson.talk.opts[L.lesson.talk.a];
    s.target=target;
    body=`<span class="phase">${s.k==="sayS"?"Falar · diga a frase inteira!":"Falar · agora é sua vez!"}</span>${s.k!=="talkSay"?`<div class="big">${w[2]}</div>`:`<div class="who">🦉</div><div class="pt">${esc(L.lesson.talk.q)}</div>`}
    <div class="word" style="font-size:${target.length>12?30:42}px">${esc(target)}</div>
    <div class="row"><button class="speak" id="sp" aria-label="Ouvir">🔊</button><button class="speak slow" id="sl" aria-label="Ouvir devagar">🐢</button></div>
    ${dict?`<button class="mic" id="mic" aria-label="Falar">🎤</button><div class="heard" id="heard">${esc(micMsg||"Toque no microfone 🎤 e fale no headset")}</div>`
          :`<div class="banner" style="text-align:left">${esc(micMsg||"🎧 Ligando o microfone do headset…")}</div><button class="btn alt" id="micretry">Tentar de novo 🔄</button>`}
    <div class="tries">${[0,1,2].map(n=>`<i class="${n<L.tries?"used":""}"></i>`).join("")}</div><div class="feedback" id="fb"></div>`;
  } else if(s.k==="talk"){
    const t=L.lesson.talk;
    body=`<span class="phase">Conversar · escolha a resposta</span>
    <div class="bubble"><span class="who">🦉</span><span>${esc(t.q)}</span></div><div class="pt">${esc(t.qpt)}</div>
    <button class="speak" id="sp" aria-label="Ouvir pergunta">🔊</button>
    <div class="grid">${L.tOrder.map(j=>`<button class="opt txt wide" data-j="${j}">${esc(t.opts[j])}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  }
  app.innerHTML=header()+`<div class="stage">${body}</div>${preview?`<div class="banner">Modo teste: nada desta aula é salvo no relatório.</div>`:""}`;
  $("#quit").onclick=()=>{stopMic();view=preview?"report":"home";render()};
  const audioText=s.k==="build"?s.sent:s.k==="talk"||s.k==="talkSay"?L.lesson.talk.q:(s.k==="say"||s.k==="sayS"?s.target:w&&w[0]);
  $("#sp")&&($("#sp").onclick=()=>say(s.k==="talkSay"?s.target:audioText));
  $("#sl")&&($("#sl").onclick=()=>say(s.target||w[0],true));
  $("#nx")&&($("#nx").onclick=next);
  if(s.k==="learn"||s.k==="listen"||s.k==="spell"||s.k==="write")setTimeout(()=>say(w[0]),250);
  if(s.k==="build")setTimeout(()=>say(s.sent),250);
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>buildTile(s,+b.dataset.t,b));
  if($("#wb")){$("#ck").onclick=()=>checkWrite(s);$("#wb").onkeydown=e=>{if(e.key==="Enter")checkWrite(s)};setTimeout(()=>$("#wb")&&$("#wb").focus(),60)}
  if(s.k==="talk")setTimeout(()=>say(L.lesson.talk.q),250);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(s,+b.dataset.j,b));
  document.querySelectorAll(".key").forEach(b=>b.onclick=()=>spellKey(s,+b.dataset.k,b));
  if($("#mic"))$("#mic").onclick=()=>startMic(s);
  if($("#micretry"))$("#micretry").onclick=()=>{micMsg="";if(!dict&&wsrObj)dict=wsrObj;
    if(dict){render();return}
    const fail=()=>{micMsg="🎧 Não consegui ligar o microfone. Confira o headset, feche e abra o app de novo no Google Chrome.";render()};
    if(window.claude&&window.claude.use)claude.use("dictation").then(d=>{if(d){hookDict(d);render()}else fail()}).catch(fail);else fail()};
}
function choose(s,j,btn){
  if(btn.classList.contains("ok"))return;
  const right=s.k==="talk"?j===L.lesson.talk.a:s.opts[j]===s.w;
  const fb=$("#fb");
  if(L.firstTry)L.qTot++;
  if(right){btn.classList.add("ok");if(L.firstTry)L.qOk++;tone(true);
    if(s.k!=="talk")say(s.w[0]);else say(L.lesson.talk.opts[L.lesson.talk.a]);
    fb.className="feedback g";fb.textContent=["Great job! 🎉","Awesome! ⭐","You got it! 🙌","Super! 🚀"][Math.floor(Math.random()*4)];
    document.querySelectorAll(".opt").forEach(b=>b.disabled=true);setTimeout(next,1300);}
  else{btn.classList.add("bad");tone(false);
    if(L.firstTry){const key=s.k==="talk"?"conversa: "+L.lesson.talk.q:s.w[0];L.misses[key]=(L.misses[key]||0)+1}
    L.firstTry=false;fb.className="feedback r";fb.textContent="Quase! Tente de novo 💪";
    setTimeout(()=>{btn.classList.remove("bad");if(s.k==="listen")say(s.w[0])},450);}
}
function spellKey(s,j,btn){
  const st=s.st,k=st.bank[j];if(k.used||st.pos>=s.w[0].length)return;
  const need=s.w[0][st.pos].toLowerCase();const fb=$("#fb");
  if(k.c===need){k.used=true;st.pos++;st.err=0;btn.disabled=true;btn.classList.add("used");
    document.querySelectorAll(".key.hint").forEach(x=>x.classList.remove("hint"));
    const sl=document.querySelectorAll(".slot")[st.pos-1];if(sl){sl.textContent=need.toUpperCase();sl.classList.add("on","pop")}
    if(st.pos>=s.w[0].length){L.qTot++;if(L.firstTry)L.qOk++;say(s.w[0]);good(L.firstTry?"Perfect spelling!":"Muito bem!")}
    else{fb.className="feedback";fb.textContent=""}
  }else{
    btn.classList.add("bad");tone(false);
    if(L.firstTry){const key="escrita: "+s.w[0];L.misses[key]=(L.misses[key]||0)+1}
    L.firstTry=false;st.err++;
    fb.className="feedback r";fb.textContent=st.err>=3?"Olha a dica brilhando 👀":"Essa não é a próxima letra 💪";
    setTimeout(()=>btn.classList.remove("bad"),450);
    if(st.err===2)say(s.w[0],true);
    if(st.err>=3){const h=[...document.querySelectorAll(".key")].find(x=>!st.bank[+x.dataset.k].used&&st.bank[+x.dataset.k].c===need);if(h)h.classList.add("hint")}
  }
}
function checkWrite(s){
  const inp=$("#wb"),fb=$("#fb"),h=$("#hint");const v=norm(inp.value),t=norm(s.w[0]);if(!v)return;
  if(v===t||(t.length>4&&lev(v,t)<=1&&!s.err)){L.qTot++;if(L.firstTry)L.qOk++;say(s.w[0]);inp.disabled=true;
    good(v===t?(L.firstTry?"Perfect writing!":"Muito bem!"):"Quase perfeito! Escreve-se: "+s.w[0]);return}
  if(L.firstTry){const key="escrita: "+s.w[0];L.misses[key]=(L.misses[key]||0)+1}
  L.firstTry=false;s.err++;tone(false);inp.classList.add("bad");setTimeout(()=>inp.classList.remove("bad"),450);
  fb.className="feedback r";
  if(s.err>=3){h.innerHTML=`A resposta é <b>${esc(s.w[0])}</b>. Escreva igual para treinar 💪`;fb.textContent="Agora copie a palavra";say(s.w[0],true)}
  else if(s.err===2){h.innerHTML=`Dica: começa com <b>${esc(s.w[0].slice(0,2))}</b>… e tem ${s.w[0].length} letras`;fb.textContent="Tente de novo 💪";say(s.w[0],true)}
  else{fb.textContent="Quase! Ouça de novo e tente 💪";say(s.w[0])}

}
function buildTile(s,j,btn){
  const st=s.st,k=st.bank[j],words=s.sent.split(" ");if(k.used||st.pos>=words.length)return;const fb=$("#fb");
  if(k.c===words[st.pos]){k.used=true;btn.disabled=true;btn.classList.add("used");
    const sl=document.querySelectorAll(".wslot")[st.pos];st.pos++;if(sl){sl.textContent=k.c;sl.classList.add("on","pop")}
    if(st.pos>=words.length){L.qTot++;if(L.firstTry)L.qOk++;say(s.sent);good(L.firstTry?"Perfect sentence!":"Muito bem!")}
    else{fb.className="feedback";fb.textContent=""}
  }else{btn.classList.add("bad");tone(false);
    if(L.firstTry){const key="frase: "+s.sent;L.misses[key]=(L.misses[key]||0)+1}
    L.firstTry=false;fb.className="feedback r";fb.textContent="Essa palavra vem depois 💪";setTimeout(()=>btn.classList.remove("bad"),450)}
}
function good(msg){const fb=$("#fb");fb.className="feedback g";fb.textContent=msg+" 🎉";tone(true);confetti(40);
  document.querySelectorAll("button:not(#quit)").forEach(b=>b.disabled=true);setTimeout(next,1400)}

/* ---------- MICROPHONE (dictation capability) ---------- */
let micStep=null, heardBuf="", micDone=false;
function startMic(s){
  if(!dict)return;micStep=s;heardBuf="";micDone=false;micMsg="";
  const h=$("#heard");if(h)h.textContent="Ouvindo… fale agora!";
  dict.start(dict===wsrObj?undefined:{language:"en"}).catch(err=>{
    micStep=null;micDone=true;const c=err&&err.code;
    if(c==="not_granted"&&dict!==wsrObj&&wsrObj){dict=wsrObj;micMsg="Toque no microfone 🎤 de novo e fale"}
    else if(c==="not_granted")micMsg="🔒 O Chrome bloqueou o microfone. Chame o papai: clique no cadeado ao lado do endereço, ative o Microfone e recarregue a página.";
    else if(c==="no_mic")micMsg="🎧 Não achei o headset. Confira se o fone está encaixado no computador e toque de novo.";
    else if(dict!==wsrObj&&wsrObj){dict=wsrObj;micMsg="Toque no microfone 🎤 de novo e fale"}
    else micMsg="Não consegui ouvir. Toque no microfone 🎤 de novo.";
    const m=$("#mic");if(m)m.classList.remove("on");
    const h=$("#heard");if(h)h.textContent=micMsg;
  });
  setTimeout(()=>{if(micStep===s&&!micDone)dict&&dict.stop().then(()=>evaluate(s))},6000);
}
function stopMic(){if(dict&&dict.active())dict.stop().catch(()=>{});micStep=null}
function onDictState(e){const m=$("#mic");if(m)m.classList.toggle("on",e.state==="listening"||e.state==="starting");
  if(e.state==="idle"&&micStep&&!micDone)evaluate(micStep)}
function onHeard(text,final){
  if(!micStep||micDone)return;
  if(final)heardBuf+=text;
  const shown=(heardBuf+(final?"":" "+text)).trim();
  const h=$("#heard");if(h)h.textContent=shown?`Ouvi: "${shown}"`:"Ouvindo…";
  if(matches(shown,micStep.target)){micDone=true;const s=micStep;stopMic();
    L.speak.push({w:s.target,tries:L.tries+1,ok:true,verified:true});good(L.tries===0?"Perfect pronunciation!":"Muito bem!");}
}
function evaluate(s){
  if(micDone||micStep!==s)return;micDone=true;micStep=null;
  const fb=$("#fb");if(!fb)return;
  if(matches(heardBuf,s.target)){L.speak.push({w:s.target,tries:L.tries+1,ok:true,verified:true});good("Muito bem!");return}
  L.tries++;tone(false);
  const misses=document.querySelectorAll(".tries i");misses.forEach((x,n)=>x.classList.toggle("used",n<L.tries));
  if(L.tries>=3){fb.className="feedback r";fb.textContent="Vamos ouvir bem devagar e tentar mais uma vez 🐢";say(s.target,true);
    L.misses["fala: "+s.target]=(L.misses["fala: "+s.target]||0)+1;L.tries=0;setTimeout(()=>misses.forEach(x=>x.classList.remove("used")),1500)}
  else{fb.className="feedback r";fb.textContent=heardBuf.trim()?"Quase! Ouça e tente de novo 💪":"Não ouvi nada. Fale mais perto 🎤";say(s.target)}
  const h=$("#heard");if(h&&!heardBuf.trim())h.textContent="Toque no microfone e fale";
}

/* ---------- FINISH ---------- */
function finish(){
  const ms=Date.now()-L.t0;const acc=L.qTot?L.qOk/L.qTot:1;
  const speakFirst=L.speak.filter(x=>x.tries===1).length/(L.speak.length||1);
  const stars=acc>=.85&&speakFirst>=.75?3:acc>=.6?2:1;
  const entry={lesson:L.lesson.id,date:today(),ms,qOk:L.qOk,qTot:L.qTot,misses:L.misses,speak:L.speak,stars};
  if(!preview){S.log.push(entry);save()}
  L.result=entry;view="end";render();confetti(140);
}
function renderEnd(){
  const r=L.result;const mins=Math.max(1,Math.round(r.ms/60000));
  const dn=sched().done.size;let award="";
  if(!preview&&dn%PER_MODULE===0){const k=dn/PER_MODULE-1;award=`<div class="teaser pop"><span class="chest">🎁</span><span class="t"><b>Você abriu o baú do Mês ${k+1}!</b><span>Prêmio: ${esc(S.prizes[k].t)}. Mostre para o papai!</span></span></div>`}
  else if(!preview&&dn%7===0){award=`<div class="teaser pop"><span class="chest">🏅</span><span class="t"><b>Selo da Semana ${((dn/7-1)%4)+1} conquistado!</b><span>Faltam ${PER_MODULE-dn%PER_MODULE} aulas para o baú do Mês ${Math.floor(dn/PER_MODULE)+1}.</span></span></div>`}
  app.innerHTML=`<div class="stage" style="justify-content:center">
   <div class="big pop">🏆</div><h2 style="font-size:32px">Lesson complete!</h2>
   <div class="stars" style="font-size:44px">${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}</div>
   <div class="kpis" style="width:100%"><div class="kpi"><b>${r.qOk}/${r.qTot}</b><span>acertos de primeira</span></div><div class="kpi"><b>${mins} min</b><span>tempo da aula</span></div></div>
   ${award}
   ${Object.keys(r.misses).length?`<div class="note">Para treinar mais: ${Object.keys(r.misses).map(esc).join(", ")}</div>`:`<div class="note">Nenhum erro. Incrível!</div>`}
   ${!preview&&sched().next?`<button class="btn sun" id="more">PRÓXIMA FASE ▶</button>`:""}
   <button class="btn${!preview&&sched().next?" alt":""}" id="home">${preview?"Voltar ao relatório":"Voltar para a trilha"}</button></div>`;
  $("#home").onclick=()=>{view=preview?"report":"home";render()};
  $("#more")&&($("#more").onclick=()=>startLesson(sched().next,false));
}

/* ---------- PARENT GATE + REPORT ---------- */
const PIN="7414";
function renderGate(){
  app.innerHTML=`<div class="stage gate"><span class="phase">Área do papai</span><h2>Digite a senha</h2>
   <input id="ga" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Senha"><div class="row"><button class="btn alt" id="gb">Voltar</button><button class="btn" id="gk">Entrar</button></div><div class="feedback r" id="gf"></div></div>`;
  setTimeout(()=>$("#ga").focus(),50);
  const go=()=>{if($("#ga").value===PIN){view="report";render()}else{$("#gf").textContent="Senha incorreta.";$("#ga").value=""}};
  $("#gk").onclick=go;$("#ga").onkeydown=e=>{if(e.key==="Enter")go()};$("#gb").onclick=()=>{view="home";render()};
}
function fmtDate(d){const [y,m,dd]=d.split("-");return dd+"/"+m}
function summaryText(){
  const sc=sched();const t=S.log.filter(l=>l.date===today());
  const q=S.log.reduce((a,l)=>[a[0]+l.qOk,a[1]+l.qTot],[0,0]);
  const sp=S.log.flatMap(l=>l.speak).filter(x=>x.verified);
  const weak=weakWords().slice(0,5).map(x=>x[0]);
  let s=`📘 English do Lorenzo · ${fmtDate(today())}\n`;
  s+=t.length?`Hoje: ${t.map(l=>LESSONS.find(x=>x.id===l.lesson).title+" ("+"⭐".repeat(l.stars)+", "+l.qOk+"/"+l.qTot+")").join("; ")}\n`:`Hoje: nenhuma aula feita ainda\n`;
  s+=`Progresso: ${sc.done.size}/${LESSONS.length} aulas (${monthsLbl()}) · ${streak()} dia(s) seguidos\n`;
  s+=`Acerto geral: ${q[1]?Math.round(q[0]/q[1]*100):0}% · Pronúncia de primeira (microfone): ${sp.length?Math.round(sp.filter(x=>x.tries===1).length/sp.length*100)+"%":"medição começa agora"}\n`;
  if(sc.pending)s+=`Faltam ${sc.pending} aula(s) para fechar os ${monthsLbl()}\n`;
  if(weak.length)s+=`Treinar: ${weak.join(", ")}`;
  return s;
}
function weakWords(){const m={};S.log.forEach(l=>Object.entries(l.misses).forEach(([k,v])=>m[k]=(m[k]||0)+v));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function renderReport(){
  const sc=sched();const q=S.log.reduce((a,l)=>[a[0]+l.qOk,a[1]+l.qTot],[0,0]);
  const spAll=S.log.flatMap(l=>l.speak);const sp=spAll.filter(x=>x.verified);
  const mins=Math.round(S.log.reduce((a,l)=>a+l.ms,0)/60000);
  const weak=weakWords();
  const curMonth=modProg().cur;
  app.innerHTML=`
  <div class="top"><div class="brand"><div class="logo">📊</div><div><h1>Relatório</h1><small>Início em ${fmtDate(S.start)} · hoje ${fmtDate(today())}</small></div></div><button class="btn alt" id="back" style="font-size:16px;padding:10px 14px">Sair</button></div>
  <div class="card"><h3>Resumo do dia</h3>
    <div class="kpis">
      <div class="kpi"><b>${sc.done.size}/${LESSONS.length}</b><span>aulas feitas (${monthsLbl()})</span></div>
      <div class="kpi"><b>${streak()}</b><span>dias seguidos</span></div>
      <div class="kpi"><b>${q[1]?Math.round(q[0]/q[1]*100):"–"}${q[1]?"%":""}</b><span>acerto de primeira (perguntas)</span></div>
      <div class="kpi"><b>${sp.length?Math.round(sp.filter(x=>x.tries===1).length/sp.length*100)+"%":"–"}</b><span>pronúncia certa na 1ª tentativa (microfone)</span></div>
    </div>
    <div class="note">${sc.pending?`🔓 Modo livre: as ${LESSONS.length} aulas dos ${monthsLbl()} estão liberadas, em qualquer ordem e sem limite por dia. No Mês 2 entram escrita (digitar palavras), montar frases e falar frases inteiras. Faltam ${sc.pending} aula(s). Hoje: ${sc.doneToday}.`:"✅ "+monthsLbl()+" concluídos."} Tempo total de estudo: ${mins} min.${spAll.length>sp.length?` ${spAll.length-sp.length} fala(s) antigas foram feitas no botão, sem microfone, e ficaram fora da nota de pronúncia.`:""}</div>
    <button class="btn sun" id="copy" style="font-size:17px">Copiar resumo para WhatsApp</button><div class="note" id="copied"></div>
  </div>
  <div class="card"><h3>Palavras para reforçar</h3>
    ${weak.length?`<div class="chips">${weak.slice(0,12).map(([k,v])=>`<span class="chip">${esc(k)} ×${v}</span>`).join("")}</div>`:`<div class="chips"><span class="chip g">Nenhum erro registrado até agora</span></div>`}
  </div>
  <div class="card"><h3>Histórico de aulas</h3>
    ${S.log.length?`<div class="tbl"><table><thead><tr><th>Data</th><th>Aula</th><th>Acertos</th><th>Fala</th><th>Tempo</th><th>Nota</th></tr></thead><tbody>
    ${S.log.slice().reverse().map(l=>{const ls=LESSONS.find(x=>x.id===l.lesson);return `<tr><td>${fmtDate(l.date)}</td><td>${esc(ls.title)}</td><td>${l.qOk}/${l.qTot}</td><td>${(v=>v.length?v.filter(x=>x.tries===1).length+"/"+v.length:"–")(l.speak.filter(x=>x.verified))}</td><td>${Math.max(1,Math.round(l.ms/60000))} min</td><td class="stars">${"★".repeat(l.stars)}</td></tr>`}).join("")}
    </tbody></table></div>`:`<div class="note">Nenhuma aula feita ainda. Quando o Lorenzo terminar a primeira, ela aparece aqui com acertos, pronúncia e tempo.</div>`}
  </div>
  <div class="card"><h3>Prêmios do mapa</h3><div class="note">Cada mês concluído (28 aulas) abre um baú. Escreva o prêmio de cada um. Marque "surpresa" para ele só ver o prêmio quando chegar lá.</div>
    ${S.prizes.map((p,i)=>`<div class="przrow"><b>Mês ${i+1}</b><input type="text" id="pz-${i}" value="${esc(p.t)}" aria-label="Prêmio do mês ${i+1}"><span class="opts"><label><input type="checkbox" id="ps-${i}" ${p.surprise?"checked":""}> surpresa</label>${i<modProg().cur?`<label><input type="checkbox" id="pg-${i}" ${p.given?"checked":""}> já entreguei</label>`:""}</span></div>`).join("")}
  </div>
  <div class="card"><h3>Testar uma aula</h3><div class="note">Abra qualquer aula para ver como funciona. O modo teste não conta no relatório.</div>
    <div class="chips">${LESSONS.map(l=>`<button class="pill" data-p="${l.id}">${l.icon} ${esc(l.title)}</button>`).join("")}</div>
  </div>
  <div class="card"><h3>Trilha de 12 meses</h3>
    ${ROADMAP.map((m,i)=>`<div class="month ${i===curMonth?"cur":""}"><b>${m[0]}</b><span>${esc(m[1])}${i===curMonth?" · <b>agora</b>":""}${i>=MONTHS_OPEN?" · em breve":" · liberado"}</span></div>`).join("")}
    <div class="note">O conteúdo dos próximos meses é liberado aos poucos, conforme o desempenho dele.</div>
  </div>
  <div class="card"><h3>Transferir progresso</h3><div class="note">Leva o progresso do Lorenzo de uma versão do app para outra. Na versão antiga: Exportar. Na versão nova: cole o código e toque em Importar.</div>
    <div class="row" style="justify-content:flex-start"><button class="btn alt" id="exp" style="font-size:16px">Exportar progresso</button><button class="btn alt" id="imp" style="font-size:16px">Importar progresso</button></div>
    <textarea id="xfer" rows="4" style="width:100%;font:13px monospace;border:2px solid var(--line);border-radius:10px;padding:8px" placeholder="O código do progresso aparece aqui. Para importar, cole o código aqui e toque em Importar."></textarea><div class="note" id="xmsg"></div></div>
  <div class="card"><h3>Foto do jogador</h3><div class="note">A foto fica só neste computador (não vai para a internet).</div>
    <div class="row" style="justify-content:flex-start;align-items:center"><img src="${photo()}" alt="" style="width:64px;height:64px;object-fit:cover;border:3px solid var(--line);border-radius:8px"><input type="file" id="pf" accept="image/*"></div><div class="note" id="pfm"></div></div>
  <div class="card"><h3>Planilha de acompanhamento</h3><div class="note">${syncCfg()?.url?"✅ Ligada. Cada aula concluída vai automaticamente para a sua planilha Google. "+esc(syncInfo):"Cole aqui o link do App da Web da planilha (termina em /exec). Feito uma vez, o progresso passa a ir sozinho para a planilha."}</div>
    <input id="su" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(syncCfg()?.url||"")}" style="width:100%;font:14px monospace;border:2px solid var(--line);border-radius:10px;padding:8px;box-sizing:border-box">
    <input id="sk" type="text" placeholder="Chave (a mesma da planilha)" value="${esc(syncCfg()?.key||"")}" style="width:100%;margin-top:6px;font:14px monospace;border:2px solid var(--line);border-radius:10px;padding:8px;box-sizing:border-box">
    <div class="row" style="justify-content:flex-start"><button class="btn alt" id="ss" style="font-size:16px">Salvar e enviar agora</button></div><div class="note" id="sm"></div></div>
  <div class="card"><h3>Ajustes</h3><button class="btn alt" id="reset" style="font-size:16px">Zerar progresso</button><div class="note" id="rs"></div></div>`;
  $("#back").onclick=()=>{view="home";render()};
  S.prizes.forEach((p,i)=>{$("#pz-"+i).onchange=e=>{p.t=e.target.value.trim()||DEF_PRIZES[i];save()};$("#ps-"+i).onchange=e=>{p.surprise=e.target.checked;save()};const g=$("#pg-"+i);if(g)g.onchange=e=>{p.given=e.target.checked;save()}});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>startLesson(LESSONS.find(l=>l.id===+b.dataset.p),true));
  $("#copy").onclick=()=>{const t=summaryText();navigator.clipboard?.writeText(t).then(()=>$("#copied").textContent="Copiado! É só colar no WhatsApp.").catch(()=>{$("#copied").textContent=t})||($("#copied").textContent=t)};
  $("#exp").onclick=()=>{const c="LZ1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));const t=$("#xfer");t.value=c;t.select();
    const ok=()=>$("#xmsg").textContent="Código copiado ("+S.log.length+" aulas). Agora cole na outra versão do app.";const man=()=>$("#xmsg").textContent="Código selecionado: aperte Ctrl+C para copiar.";
    if(navigator.clipboard)navigator.clipboard.writeText(c).then(ok).catch(()=>{try{document.execCommand("copy")?ok():man()}catch(e){man()}});else man()};
  $("#imp").onclick=()=>{try{const v=$("#xfer").value.trim();const o=JSON.parse(decodeURIComponent(escape(atob(v.replace(/^LZ1:/,"")))));if(!o||!Array.isArray(o.log))throw 0;
    S=o;if(!S.start)S.start=today();save();$("#xmsg").textContent="Progresso importado: "+S.log.length+" aulas registradas. ✅";setTimeout(()=>{view="home";render()},1500)}
    catch(e){$("#xmsg").textContent="Código inválido. Copie de novo o código completo e cole aqui."}};
  $("#pf").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();const rd=new FileReader();rd.onload=()=>{im.onload=()=>{const c=document.createElement("canvas");const s=Math.min(im.width,im.height);c.width=c.height=240;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);
    try{localStorage.setItem(PHOTO_KEY,c.toDataURL("image/jpeg",.85));$("#pfm").textContent="Foto salva ✅";setTimeout(render,600)}catch(err){$("#pfm").textContent="Não consegui salvar a foto."}};im.src=rd.result};rd.readAsDataURL(f)};
  $("#ss").onclick=()=>{const url=$("#su").value.trim(),key=$("#sk").value.trim();if(url&&!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){$("#sm").textContent="O link precisa começar com https://script.google.com e terminar em /exec.";return}
    try{localStorage.setItem(SYNC_KEY,JSON.stringify({url,key}))}catch(e){}if(url){pushSync();$("#sm").textContent="Salvo. Enviando "+S.log.length+" aulas para a planilha... confira a aba Aulas em 1 minuto."}else $("#sm").textContent="Planilha desligada."};
  let armed=false;$("#reset").onclick=()=>{if(!armed){armed=true;$("#rs").textContent="Toque de novo para confirmar. Isso apaga todo o histórico.";return}
    S={start:today(),log:[],prizes:S.prizes};save();view="home";render()};
}

/* ---------- CONFETTI ---------- */
function confetti(n){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#FFB627","#2BB673","#FF5D73","#2F80ED"];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(++f<120)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();}

document.addEventListener("keydown",e=>{
  if(view!=="lesson"||!L||e.key.length!==1||e.ctrlKey||e.metaKey)return;const s=L.steps[L.i];if(!s||s.k!=="spell"||!s.st)return;
  const c=e.key.toLowerCase();const keys=[...document.querySelectorAll(".key:not(.used)")];
  const b=keys.find(x=>s.st.bank[+x.dataset.k].c===c);if(b){e.preventDefault();b.click()}
});
render();
</script>
